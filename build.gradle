plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.4.3'
}

group 'io.github.augustinlr17'
version '2.3.6'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // The production code uses the SLF4J logging API at compile time
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: '2.23.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.16.1'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.1'
    implementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5', version: '5.2.5'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.17.2'
    implementation group: 'com.fazecast', name: 'jSerialComm', version: '2.11.0'
    implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '2.0.31'
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78.1'
    implementation group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.78.1'
    implementation group: 'io.javalin', name: 'javalin', version: '6.2.0'
    implementation group: 'io.javalin.community.ssl', name: 'ssl-plugin', version: '6.2.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

application {
    mainClass = 'io.github.augustinlr17.localhardwarebridge.Launcher'
}

test {
    systemProperty 'lhb.test', 'true'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'io.github.augustinlr17.localhardwarebridge.Launcher'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'io.github.augustinlr17.localhardwarebridge.Launcher'
    }
    archiveClassifier = ''
    archiveFileName = "local-hardware-bridge-${project.version}.jar"
    exclude 'module-info.class'
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.configureEach {
    if (name in ['distTar', 'distZip', 'startScripts', 'startShadowScripts', 'shadowDistTar', 'shadowDistZip']) {
        enabled = false
    }
}

tasks.register('createLinuxApp') {
    group = 'distribution'
    description = 'Creates Linux DEB package using jpackage'
    dependsOn shadowJar
    doLast {
        exec {
            commandLine 'jpackage',
                '--type', 'deb',
                '--name', 'local-hardware-bridge',
                '--app-version', project.version,
                '--input', 'build/libs/',
                '--main-jar', "local-hardware-bridge-${project.version}.jar",
                '--main-class', 'io.github.augustinlr17.localhardwarebridge.Launcher',
                '--dest', 'build/dist/linux',
                '--icon', 'src/main/resources/icon.png',
                '--vendor', 'AugustinLR17',
                '--description', 'Local Hardware Bridge - exposes local printer and serial port to web browsers',
                '--linux-shortcut',
                '--linux-menu-group', 'Utility'
        }
    }
}

tasks.register('createRpmApp') {
    group = 'distribution'
    description = 'Creates Linux RPM package using jpackage'
    dependsOn shadowJar
    doLast {
        exec {
            commandLine 'jpackage',
                '--type', 'rpm',
                '--name', 'local-hardware-bridge',
                '--app-version', project.version,
                '--input', 'build/libs/',
                '--main-jar', "local-hardware-bridge-${project.version}.jar",
                '--main-class', 'io.github.augustinlr17.localhardwarebridge.Launcher',
                '--dest', 'build/dist/linux-rpm',
                '--vendor', 'AugustinLR17',
                '--description', 'Local Hardware Bridge - exposes local printer and serial port to web browsers',
                '--linux-shortcut',
                '--linux-menu-group', 'Utility'
        }
    }
}

tasks.register('createWindowsApp') {
    group = 'distribution'
    description = 'Creates the Windows app-image (bundled JRE + windowless launcher) for the NSIS installer'
    dependsOn shadowJar
    doLast {
        exec {
            commandLine 'jpackage',
                '--type', 'app-image',
                '--name', 'Local Hardware Bridge',
                '--app-version', project.version,
                '--input', 'build/libs/',
                '--main-jar', "local-hardware-bridge-${project.version}.jar",
                '--main-class', 'io.github.augustinlr17.localhardwarebridge.Launcher',
                '--dest', 'build/dist/appimage',
                '--icon', 'src/main/resources/icon.ico',
                '--vendor', 'AugustinLR17',
                '--description', 'Local Hardware Bridge - exposes local printer and serial port to web browsers'
        }
        println "App-image created. Now run: makensis /DPRODUCT_VERSION=${project.version} install.nsi"
    }
}