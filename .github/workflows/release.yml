name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-jar:
    name: Build Fat JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: build/libs/local-hardware-bridge-*.jar

  build-tui:
    name: Build TUI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: lhb-tui-linux-amd64
          - goos: windows
            goarch: amd64
            artifact: lhb-tui-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            artifact: lhb-tui-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: lhb-tui-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tui/go.sum

      - name: Build TUI
        working-directory: tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.artifact }} .

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tui/${{ matrix.artifact }}

  windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create MSI installer with jpackage
        run: |
          jpackage `
            --type msi `
            --name "Local Hardware Bridge" `
            --app-version ${{ steps.version.outputs.VERSION }} `
            --input build/libs/ `
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" `
            --main-class io.github.augustinlr17.localhardwarebridge.GUI `
            --dest build/dist/windows `
            --vendor AugustinLR17 `
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" `
            --icon icon.ico `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "Local Hardware Bridge" `
            --win-shortcut `
            --win-shortcut-prompt `
            --win-per-user-install
        shell: powershell

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: build/dist/windows/*.msi

      - name: Install InnoSetup for EXE installer
        run: |
          choco install innosetup -y
        shell: powershell

      - name: Create EXE installer with jpackage
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          jpackage `
            --type exe `
            --name "Local Hardware Bridge" `
            --app-version ${{ steps.version.outputs.VERSION }} `
            --input build/libs/ `
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" `
            --main-class io.github.augustinlr17.localhardwarebridge.GUI `
            --dest build/dist/windows-exe `
            --vendor AugustinLR17 `
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" `
            --icon icon.ico `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "Local Hardware Bridge" `
            --win-shortcut `
            --win-shortcut-prompt `
            --win-per-user-install `
            --win-upgrade-uuid "a8c6f1e0-5d3b-4c9e-8f2a-7b6d0e1c2f3a"
        shell: powershell

      # Sign the EXE and MSI with Authenticode (self-signed cert in CI).
      # This adds version metadata to the binary. For full SmartScreen trust,
      # replace the self-signed step with a real OV certificate stored in GitHub Secrets.
      - name: Add signtool to PATH
        shell: powershell
        run: |
          # Find signtool.exe in Windows SDK and add to GITHUB_PATH so it persists across steps
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object -Descending | Select-Object -First 1
          if ($signtool) {
            Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName
            Write-Host "Added signtool from: $($signtool.FullName)"
          } else {
            Write-Host "signtool.exe not found, skipping code signing"
          }

      - name: Generate self-signed Authenticode certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AugustinLR17, O=AugustinLR17, C=FR" `
            -HashAlgorithm SHA256 `
            -CertStoreLocation "Cert:\CurrentUser\My"
          Export-Certificate -Cert $cert -FilePath build/dist/signing.cer | Out-Null
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign EXE installer with Authenticode
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path build/dist/windows-exe -Filter *.exe | Select-Object -First 1
          if ($exe) {
            & signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $exe.FullName 2>$null
            if ($LASTEXITCODE -ne 0) {
              # Fallback: sign without timestamp (offline CI)
              & signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT $exe.FullName
            }
          }

      - name: Sign MSI installer with Authenticode
        shell: powershell
        run: |
          $msi = Get-ChildItem -Path build/dist/windows -Filter *.msi | Select-Object -First 1
          if ($msi) {
            & signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $msi.FullName 2>$null
            if ($LASTEXITCODE -ne 0) {
              & signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT $msi.FullName
            }
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/dist/windows-exe/*.exe

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/local-hardware-bridge

          cp build/libs/local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar AppDir/usr/share/local-hardware-bridge/local-hardware-bridge.jar
          cp src/main/resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/local-hardware-bridge.png

          cat > AppDir/usr/bin/local-hardware-bridge << 'SCRIPT'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR=$(dirname "$SELF")/..
          exec "${JAVA_HOME:-/usr/bin/java}" -cp "${APPDIR}/usr/share/local-hardware-bridge/local-hardware-bridge.jar" io.github.augustinlr17.localhardwarebridge.GUI "$@"
          SCRIPT
          chmod +x AppDir/usr/bin/local-hardware-bridge

          cat > AppDir/usr/share/applications/local-hardware-bridge.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Local Hardware Bridge
          Comment=Exposes local printer and serial port to web browsers
          Exec=local-hardware-bridge
          Icon=local-hardware-bridge
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          DESKTOP

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR=$(dirname "$SELF")
          exec "${JAVA_HOME:-/usr/bin/java}" -cp "${APPDIR}/usr/share/local-hardware-bridge/local-hardware-bridge.jar" io.github.augustinlr17.localhardwarebridge.GUI "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Build AppImage
        run: |
          export VERSION=${{ steps.version.outputs.VERSION }}
          export ARCH=x86_64
          ./linuxdeploy.AppImage --appdir AppDir --output appimage
          mv Local_Hardware_Bridge-*.AppImage local-hardware-bridge-${{ steps.version.outputs.VERSION }}-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: local-hardware-bridge-*.AppImage

  macos-app:
    name: macOS Application
    runs-on: macos-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Convert icon to ICNS for macOS
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/main/resources/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/main/resources/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/main/resources/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/main/resources/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Create macOS DMG with jpackage
        run: |
          jpackage \
            --type dmg \
            --name "Local Hardware Bridge" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --input build/libs/ \
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" \
            --main-class io.github.augustinlr17.localhardwarebridge.GUI \
            --dest build/dist/macos \
            --vendor AugustinLR17 \
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" \
            --icon icon.icns \
            --mac-package-name "LocalHardwareBridge" \
            --mac-package-identifier "io.github.augustinlr17.localhardwarebridge"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/dist/macos/*.dmg

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-jar, build-tui, windows-installer, linux-appimage, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## What's New in ${{ github.ref_name }}

            Local Hardware Bridge exposes local printers and serial ports to web applications via WebSocket and REST APIs.

            ### Features
            - Silent printing: PDF, images, ESC/POS raw, with annotations
            - Serial port I/O: bidirectional communication with scales, scanners, IoT devices
            - REST API: full CRUD for config, mappings, printer/serial management
            - WebSocket API: real-time streaming for serial data and print status
            - Web UI: browser-based configuration dashboard (light theme)
            - TUI Admin: terminal dashboard for bridge server administrators
            - Auth & TLS: Bearer token authentication, HTTPS/WSS support
            - Systemd service: one-command install for Linux servers

            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Cross-platform | `local-hardware-bridge-*.jar` | Requires JDK 21+ |
            | Windows | `.exe` installer | Full installer with shortcuts |
            | Windows | `.msi` installer | MSI for enterprise deployment |
            | Linux | `.AppImage` | Requires JDK 21+, portable |
            | macOS | `.dmg` installer | Intel & Apple Silicon |
            | Terminal | `lhb-tui-*` | Admin dashboard, no JVM needed |

            ## Quick Start

            ### JAR (all platforms)
            ```bash
            java -jar local-hardware-bridge-*.jar
            ```
            Web UI at `http://127.0.0.1:12212`

            ### TUI (terminal)
            ```bash
            chmod +x lhb-tui-linux-amd64
            ./lhb-tui-linux-amd64 http://127.0.0.1:12212
            ```

            ### Linux systemd service (headless, auto-start on boot)
            ```bash
            # Install and start the service
            curl -X POST http://127.0.0.1:12212/system/install-service

            # Check status
            systemctl status local-hardware-bridge

            # View logs
            journalctl -u local-hardware-bridge -f

            # Uninstall
            curl -X POST http://127.0.0.1:12212/system/uninstall-service
            ```

            ### Run modes
            - **GUI mode**: `java -jar local-hardware-bridge.jar` (system tray icon)
            - **Server mode**: `java -cp local-hardware-bridge.jar io.github.augustinlr17.localhardwarebridge.Server` (headless)
            - **TUI mode**: `./lhb-tui http://127.0.0.1:12212` (terminal dashboard)
          files: |
            artifacts/fat-jar/*.jar
            artifacts/windows-exe/*.exe
            artifacts/windows-msi/*.msi
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
            artifacts/lhb-tui-*/*
