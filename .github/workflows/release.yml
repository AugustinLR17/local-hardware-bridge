name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-jar:
    name: Build Fat JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: build/libs/local-hardware-bridge-*.jar

  build-tui:
    name: Build TUI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: lhb-tui-linux-amd64
          - goos: windows
            goarch: amd64
            artifact: lhb-tui-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            artifact: lhb-tui-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: lhb-tui-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tui/go.sum

      - name: Build TUI
        working-directory: tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.artifact }} .

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tui/${{ matrix.artifact }}

  windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # jpackage --app-version requires a numeric version (1.2.3.4).
      # Convert semver pre-release suffixes like -alpha.1, -rc.2 into a
      # 4th numeric component: 2.4.0-alpha.1 → 2.4.0.1001, 2.4.0-rc.2 → 2.4.0.3002
      # Full releases pad a 4th component: 2.4.0 → 2.4.0.0 (NSIS VIProductVersion
      # requires X.X.X.X; the 3-part display version stays in PRODUCT_VERSION).
      # Uses only POSIX sh parameter expansion — no grep -P or sed -r (macOS lacks them).
      - name: Compute numeric version for jpackage
        id: numeric-version
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          case "$V" in
            *-*)
              # Pre-release: extract base (X.Y.Z) and suffix (alpha.1, rc.2, etc.)
              BASE="${V%%-*}"
              REST="${V#*-}"
              PRE="${REST%%.*}"
              NUM="${REST#*.}"
              case "$PRE" in
                alpha) SUFFIX="1$(printf '%03d' "$NUM")" ;;
                beta)  SUFFIX="2$(printf '%03d' "$NUM")" ;;
                rc)    SUFFIX="3$(printf '%03d' "$NUM")" ;;
                *)     SUFFIX="9$(printf '%03d' "$NUM")" ;;
              esac
              echo "VERSION=${BASE}.${SUFFIX}" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=${BASE}" >> $GITHUB_OUTPUT
              ;;
            *)
              # Plain release (X.Y.Z): pad a 4th component so NSIS VIProductVersion
              # (X.X.X.X) is satisfied. jpackage accepts 4 parts too; the
              # human-readable FileVersion/ProductVersion use the 3-part PRODUCT_VERSION.
              echo "VERSION=${V}.0" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=$V" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Verify tag matches build.gradle version
        shell: bash
        run: |
          GRADLE_VERSION=$(grep "^version " build.gradle | sed "s/version '\(.*\)'/\1/")
          if [ "$GRADLE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version '${{ steps.version.outputs.VERSION }}' does not match build.gradle version '$GRADLE_VERSION'. Bump build.gradle (and Constants.VERSION / install.nsi) or fix the tag."
            exit 1
          fi
          echo "Version check passed: $GRADLE_VERSION"

      # Build a self-contained app-image: bundled JRE + a windowless native launcher
      # (GUI subsystem -> no console window). The NSIS installer wraps this.
      - name: Create app-image with jpackage
        run: |
          jpackage `
            --type app-image `
            --name "Local Hardware Bridge" `
            --app-version ${{ steps.numeric-version.outputs.VERSION }} `
            --input build/libs/ `
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" `
            --main-class io.github.augustinlr17.localhardwarebridge.Launcher `
            --dest build/dist/appimage `
            --vendor AugustinLR17 `
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" `
            --icon icon.ico
        shell: powershell

      # --------------------------------------------------------------------------
      # Code signing via Jsign + SSL.com eSigner (cloud code signing)
      # --------------------------------------------------------------------------
      # Signs the jpackage native launcher ("Local Hardware Bridge.exe") so
      # Microsoft Defender doesn't flag the auto-start registry entry as
      # persistence (ASEP) and SmartScreen doesn't warn.
      #
      # Uses Jsign instead of sslcom/esigner-codesign because CodeSignTool v1.3.0
      # doesn't URL-encode special characters (#, !) in the OAuth2 password,
      # causing "invalid_grant" errors. Jsign handles this correctly.
      #
      # IMPORTANT: if you get "invalid_grant" errors, check:
      #   1. ES_USERNAME / ES_PASSWORD are correct in GitHub Secrets
      #   2. The SSL.com account is active (not expired/suspended)
      #   3. ES_TOTP_SECRET is in BASE64 format (not base32 — Jsign uses base64)
      #   4. CREDENTIAL_ID matches the eSigner certificate in the SSL.com dashboard
      #
      # Signing failures fail the build — we do not ship unsigned binaries silently.
      #
      # Gated on the ESIGNER_ENABLED repo variable. Secrets required:
      #   ES_USERNAME     — SSL.com account email
      #   ES_PASSWORD     — SSL.com account password
      #   CREDENTIAL_ID  — eSigner credential ID (from SSL.com dashboard)
      #   ES_TOTP_SECRET — TOTP secret in BASE64 (not base32 — Jsign uses base64)
      - name: Download Jsign
        if: ${{ vars.ESIGNER_ENABLED == 'true' }}
        run: curl -sL https://github.com/ebourg/jsign/releases/download/7.4/jsign-7.4.jar -o jsign.jar
        shell: bash

      - name: Sign jpackage launcher with eSigner
        if: ${{ vars.ESIGNER_ENABLED == 'true' }}
        env:
          ES_USER: ${{ secrets.ES_USERNAME }}
          ES_PASS: ${{ secrets.ES_PASSWORD }}
          ES_CRED: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $exe = "${{ github.workspace }}\build\dist\appimage\Local Hardware Bridge\Local Hardware Bridge.exe"
          attrib -r "$exe"
          Write-Host "ES_USER length: $($env:ES_USER.Length)"
          Write-Host "ES_PASS length: $($env:ES_PASS.Length)"
          Write-Host "ES_CRED length: $($env:ES_CRED.Length)"
          Write-Host "ES_TOTP length: $($env:ES_TOTP.Length)"
          java -jar jsign.jar --storetype ESIGNER --storepass "$env:ES_USER|$env:ES_PASS" --alias "$env:ES_CRED" --keypass "$env:ES_TOTP" --debug "$exe"
        shell: powershell

      - name: Install NSIS (>= 3.08 for !uninstfinalize uninstaller signing)
        run: choco install nsis --version=3.10 -y
        shell: powershell

      - name: Build single .exe installer with NSIS
        env:
          ES_USER: ${{ secrets.ES_USERNAME }}
          ES_PASS: ${{ secrets.ES_PASSWORD }}
          ES_CRED: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $defs = @("/DPRODUCT_VERSION=${{ steps.version.outputs.VERSION }}", "/DNUMERIC_VERSION=${{ steps.numeric-version.outputs.VERSION }}")
          # Sign the uninstaller stub inside makensis when eSigner is enabled (jsign.jar was downloaded earlier).
          if ("${{ vars.ESIGNER_ENABLED }}" -eq "true") { $defs += "/DSIGN_UNINSTALLER=1" }
          & $nsis @defs install.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path build/dist/windows-exe | Out-Null
          Move-Item -Force lhb.exe "build/dist/windows-exe/Local-Hardware-Bridge-${{ steps.version.outputs.VERSION }}.exe"
        shell: powershell

      - name: Sign NSIS installer with eSigner
        if: ${{ vars.ESIGNER_ENABLED == 'true' }}
        env:
          ES_USER: ${{ secrets.ES_USERNAME }}
          ES_PASS: ${{ secrets.ES_PASSWORD }}
          ES_CRED: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $exe = "${{ github.workspace }}\build\dist\windows-exe\Local-Hardware-Bridge-${{ steps.version.outputs.VERSION }}.exe"
          attrib -r "$exe"
          java -jar jsign.jar --storetype ESIGNER --storepass "$env:ES_USER|$env:ES_PASS" --alias "$env:ES_CRED" --keypass "$env:ES_TOTP" "$exe"
        shell: powershell

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/dist/windows-exe/*.exe

      # --------------------------------------------------------------------------
      # Build a ready-to-deploy .intunewin package for Microsoft Intune.
      # The package bundles: a dedicated NSIS installer built with NO_DESKTOP_ICON,
      # the install/uninstall PowerShell wrappers, and the enterprise config
      # template (auto-update enabled). The admin just uploads it to Intune.
      # --------------------------------------------------------------------------
      - name: Build Intune NSIS installer (no desktop icon)
        env:
          ES_USER: ${{ secrets.ES_USERNAME }}
          ES_PASS: ${{ secrets.ES_PASSWORD }}
          ES_CRED: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $defs = @("/DPRODUCT_VERSION=${{ steps.version.outputs.VERSION }}", "/DNUMERIC_VERSION=${{ steps.numeric-version.outputs.VERSION }}", "/DNO_DESKTOP_ICON=1")
          if ("${{ vars.ESIGNER_ENABLED }}" -eq "true") { $defs += "/DSIGN_UNINSTALLER=1" }
          & $nsis @defs install.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis (intune) failed with exit code $LASTEXITCODE" }
        shell: powershell

      - name: Sign Intune NSIS installer with eSigner
        if: ${{ vars.ESIGNER_ENABLED == 'true' }}
        env:
          ES_USER: ${{ secrets.ES_USERNAME }}
          ES_PASS: ${{ secrets.ES_PASSWORD }}
          ES_CRED: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $exe = "${{ github.workspace }}\lhb.exe"
          attrib -r "$exe"
          java -jar jsign.jar --storetype ESIGNER --storepass "$env:ES_USER|$env:ES_PASS" --alias "$env:ES_CRED" --keypass "$env:ES_TOTP" "$exe"
        shell: powershell

      - name: Assemble Intune package source folder
        run: |
          $src = "build\dist\intune-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          # Rename installer to lhb.exe (install.ps1 auto-detects this name)
          Copy-Item "lhb.exe" "$src\lhb.exe" -Force
          Copy-Item "packaging\intune\install.ps1" "$src\install.ps1"
          Copy-Item "packaging\intune\uninstall.ps1" "$src\uninstall.ps1"
          Copy-Item "packaging\intune\config-template.json" "$src\config-template.json"
          Write-Host "Intune source folder contents:"
          Get-ChildItem $src | Format-Table Name, Length
        shell: powershell

      - name: Download IntuneWinAppUtil
        run: powershell -ExecutionPolicy Bypass -File packaging/intune/download-intunewinutil.ps1
        shell: pwsh

      - name: Build .intunewin package
        run: |
          New-Item -ItemType Directory -Force -Path "build\dist\intune-out" | Out-Null
          .\IntuneWinAppUtil.exe `
            -c "build\dist\intune-src" `
            -s install.ps1 `
            -o "build\dist\intune-out" `
            -q
          # Rename to include the version
          Move-Item "build\dist\intune-out\install.intunewin" `
            "build\dist\intune-out\Local-Hardware-Bridge-${{ steps.version.outputs.VERSION }}.intunewin" -Force
          Write-Host "Built .intunewin package:"
          Get-ChildItem "build\dist\intune-out" | Format-Table Name, Length
        shell: powershell

      - name: Upload Intune package
        uses: actions/upload-artifact@v4
        with:
          name: intune-package
          path: build/dist/intune-out/*.intunewin

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute numeric version for jpackage
        id: numeric-version
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          case "$V" in
            *-*)
              BASE="${V%%-*}"
              REST="${V#*-}"
              PRE="${REST%%.*}"
              NUM="${REST#*.}"
              case "$PRE" in
                alpha) SUFFIX="1$(printf '%03d' "$NUM")" ;;
                beta)  SUFFIX="2$(printf '%03d' "$NUM")" ;;
                rc)    SUFFIX="3$(printf '%03d' "$NUM")" ;;
                *)     SUFFIX="9$(printf '%03d' "$NUM")" ;;
              esac
              echo "VERSION=${BASE}.${SUFFIX}" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=${BASE}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "VERSION=$V" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=$V" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Verify tag matches build.gradle version
        run: |
          GRADLE_VERSION=$(grep "^version " build.gradle | sed "s/version '\(.*\)'/\1/")
          if [ "$GRADLE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version '${{ steps.version.outputs.VERSION }}' does not match build.gradle version '$GRADLE_VERSION'. Bump build.gradle (and Constants.VERSION / install.nsi) or fix the tag."
            exit 1
          fi
          echo "Version check passed: $GRADLE_VERSION"

      - name: Create app-image with jpackage (bundled JRE)
        run: |
          jpackage \
            --type app-image \
            --name "Local Hardware Bridge" \
            --app-version ${{ steps.numeric-version.outputs.VERSION }} \
            --input build/libs/ \
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" \
            --main-class io.github.augustinlr17.localhardwarebridge.Launcher \
            --dest build/dist/appimage \
            --vendor AugustinLR17 \
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" \
            --icon src/main/resources/icon.png

      - name: Assemble AppDir from app-image
        run: |
          # Copy the entire jpackage app-image (bundled JRE + native launcher) into AppDir
          mkdir -p AppDir/usr/lib
          cp -r "build/dist/appimage/Local Hardware Bridge" AppDir/usr/lib/local-hardware-bridge

          # Desktop entry — appimagetool looks for *.desktop at the AppDir root
          cat > AppDir/local-hardware-bridge.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Local Hardware Bridge
          Comment=Exposes local printer and serial port to web browsers
          Exec=local-hardware-bridge
          Icon=local-hardware-bridge
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          DESKTOP

          # Icon — appimagetool looks for the icon at AppDir root via .DirIcon
          cp src/main/resources/icon.png AppDir/local-hardware-bridge.png
          ln -sf local-hardware-bridge.png AppDir/.DirIcon

          # AppRun — delegates to the jpackage launcher (which finds its bundled JRE)
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR=$(dirname "$SELF")
          exec "$APPDIR/usr/lib/local-hardware-bridge/bin/Local Hardware Bridge" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      # The jpackage app-image is self-contained (bundled JRE + native launcher).
      # We use appimagetool directly instead of linuxdeploy because linuxdeploy
      # tries to resolve ELF dependencies for the JRE's internal .so files
      # (e.g. libmanagement_agent.so → libjvm.so) and fails — libjvm.so is inside
      # the JRE in a non-standard path. appimagetool just packages the AppDir
      # into an AppImage without dependency resolution, which is exactly what
      # a self-contained jpackage app needs.
      - name: Install libfuse2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          export VERSION=${{ steps.version.outputs.VERSION }}
          export ARCH=x86_64
          ./appimagetool.AppImage AppDir "local-hardware-bridge-${{ steps.version.outputs.VERSION }}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: local-hardware-bridge-*.AppImage

  macos-app:
    name: macOS Application
    runs-on: macos-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute numeric version for jpackage
        id: numeric-version
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          case "$V" in
            *-*)
              BASE="${V%%-*}"
              REST="${V#*-}"
              PRE="${REST%%.*}"
              NUM="${REST#*.}"
              case "$PRE" in
                alpha) SUFFIX="1$(printf '%03d' "$NUM")" ;;
                beta)  SUFFIX="2$(printf '%03d' "$NUM")" ;;
                rc)    SUFFIX="3$(printf '%03d' "$NUM")" ;;
                *)     SUFFIX="9$(printf '%03d' "$NUM")" ;;
              esac
              echo "VERSION=${BASE}.${SUFFIX}" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=${BASE}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "VERSION=$V" >> $GITHUB_OUTPUT
              echo "MAC_VERSION=$V" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Verify tag matches build.gradle version
        run: |
          GRADLE_VERSION=$(grep "^version " build.gradle | sed "s/version '\(.*\)'/\1/")
          if [ "$GRADLE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version '${{ steps.version.outputs.VERSION }}' does not match build.gradle version '$GRADLE_VERSION'. Bump build.gradle (and Constants.VERSION / install.nsi) or fix the tag."
            exit 1
          fi
          echo "Version check passed: $GRADLE_VERSION"

      - name: Convert icon to ICNS for macOS
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/main/resources/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/main/resources/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/main/resources/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/main/resources/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Create macOS DMG with jpackage
        run: |
          jpackage \
            --type dmg \
            --name "Local Hardware Bridge" \
            --app-version "${{ steps.numeric-version.outputs.MAC_VERSION }}" \
            --input build/libs/ \
            --main-jar "local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar" \
            --main-class io.github.augustinlr17.localhardwarebridge.Launcher \
            --dest build/dist/macos \
            --vendor AugustinLR17 \
            --description "Local Hardware Bridge - exposes local printer and serial port to web browsers" \
            --icon icon.icns \
            --mac-package-name "LocalHardwareBridge" \
            --mac-package-identifier "io.github.augustinlr17.localhardwarebridge"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/dist/macos/*.dmg

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-jar, build-tui, windows-installer, linux-appimage, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release artifacts
        run: find artifacts -type f | sort

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          # Hash every collected artifact; store paths relative to artifacts/.
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## What's New in ${{ github.ref_name }}

            Local Hardware Bridge exposes local printers and serial ports to web applications via WebSocket and REST APIs.

            ### Features
            - Silent printing: PDF, images, ESC/POS raw, with annotations
            - Serial port I/O: bidirectional communication with scales, scanners, IoT devices
            - REST API: full CRUD for config, mappings, printer/serial management
            - WebSocket API: real-time streaming for serial data and print status
            - Web UI: browser-based configuration dashboard (light theme)
            - TUI Admin: terminal dashboard for bridge server administrators
            - Auth & TLS: Bearer token authentication, HTTPS/WSS support
            - Systemd service: one-command install for Linux servers

            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Cross-platform | `local-hardware-bridge-*.jar` | Requires JDK 21+ |
            | Windows | `Local-Hardware-Bridge-*.exe` | Single installer, bundled Java, runs in background, auto-start${{ vars.ESIGNER_ENABLED == 'true' && ', code-signed via SSL.com eSigner' || '' }} |
            | Intune | `*.intunewin` | Ready-to-deploy Win32 app package (no desktop icon, auto-update enabled, enterprise config) |
            | Linux | `.AppImage` | Self-contained, bundled Java, no JDK needed |
            | macOS | `.dmg` installer | Intel & Apple Silicon |
            | Terminal | `lhb-tui-*` | Admin dashboard, no JVM needed |

            ## Quick Start

            ### JAR (all platforms)
            ```bash
            java -jar local-hardware-bridge-*.jar
            ```
            Web UI at `http://127.0.0.1:57212`

            ### TUI (terminal)
            ```bash
            chmod +x lhb-tui-linux-amd64
            ./lhb-tui-linux-amd64 http://127.0.0.1:57212
            ```

            ### Linux systemd service (headless, auto-start on boot)
            ```bash
            # Install and start the service
            curl -X POST http://127.0.0.1:57212/system/install-service

            # Check status
            systemctl status local-hardware-bridge

            # View logs
            journalctl -u local-hardware-bridge -f

            # Uninstall
            curl -X POST http://127.0.0.1:57212/system/uninstall-service
            ```

            ### Run modes
            - **GUI mode**: `java -jar local-hardware-bridge.jar` (system tray icon)
            - **Server mode**: `java -cp local-hardware-bridge.jar io.github.augustinlr17.localhardwarebridge.Server` (headless)
            - **TUI mode**: `./lhb-tui http://127.0.0.1:57212` (terminal dashboard)
          files: |
            artifacts/fat-jar/*.jar
            artifacts/windows-exe/*.exe
            artifacts/intune-package/*.intunewin
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
            artifacts/lhb-tui-*/*
            artifacts/SHA256SUMS

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [build-jar, release]
    # Gated on AUR_PUBLISH_ENABLED so the build doesn't fail when the AUR
    # account/SSH key isn't configured. To enable:
    #   Repository Settings → Secrets and variables → Actions → Variables
    #   AUR_PUBLISH_ENABLED = true
    # Prerequisites:
    #   - An AUR account (register at https://aur.archlinux.org/register —
    #     registration is periodically disabled; if closed, ask on
    #     aur-general@lists.archlinux.org)
    #   - SSH key added to your AUR account (My Account → SSH Keys)
    #   - Private key in the AUR_SSH_KEY secret
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download fat JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: jar

      - name: Compute SHA256 of JAR
        id: sha
        run: |
          JAR_FILE="jar/local-hardware-bridge-${{ steps.version.outputs.VERSION }}.jar"
          SHA=$(sha256sum "$JAR_FILE" | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "JAR SHA256: $SHA"

      - name: Prepare SSH key for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur_key" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          # Trust the AUR host key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone AUR repo
        run: |
          git clone ssh://aur@aur.archlinux.org/local-hardware-bridge-bin.git aur-repo
          cd aur-repo
          git config user.name "AugustinLR17"
          git config user.email "augustin@augustin-roux.info"

      - name: Update PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA256="${{ steps.sha.outputs.SHA256 }}"

          # Copy the template PKGBUILD
          cp packaging/aur/PKGBUILD aur-repo/PKGBUILD

          # Update version and sha256sums
          sed -i "s/^pkgver=.*/pkgver='$VERSION'/" aur-repo/PKGBUILD
          # Replace the first SKIP (JAR) with the actual hash, keep second SKIP (LICENSE)
          sed -i "0,/'SKIP'/s//'$SHA256'/" aur-repo/PKGBUILD

          # Generate .SRCINFO (required by AUR)
          cd aur-repo
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm pkgfile && makepkg --printsrcinfo > .SRCINFO"

          echo "=== Updated PKGBUILD ==="
          cat PKGBUILD
          echo "=== .SRCINFO ==="
          cat .SRCINFO

      - name: Push to AUR
        run: |
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.version.outputs.VERSION }}"
          git push origin master
