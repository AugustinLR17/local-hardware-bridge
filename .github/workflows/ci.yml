name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# NOTE: Third-party GitHub Actions below (actions/*, gradle/*) are pinned to
# major version tags for readability. For supply-chain hardening they should be
# pinned to full commit SHAs (e.g. actions/checkout@<sha>). Do this when bumping.

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # `./gradlew build` already runs the `test` task, so no separate test step.
      - name: Build
        run: ./gradlew build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tui/go.sum

      - name: Check TUI formatting (gofmt)
        working-directory: tui
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet TUI
        working-directory: tui
        run: go vet ./...

      - name: Build TUI
        working-directory: tui
        run: go build -o ../build/lhb-tui .

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: local-hardware-bridge-jar
          path: build/libs/local-hardware-bridge-*.jar
          retention-days: 7

  compile-cross-platform:
    name: Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile-only sanity check so non-Linux build breaks are caught early.
      - name: Compile Java
        run: ./gradlew compileJava

  intune-scripts:
    name: Intune PowerShell scripts tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test migrate-whb-config.ps1 (6 fleet scenarios)
        shell: pwsh
        run: ./packaging/intune/tests/test-migrate.ps1
      - name: Test check-lhb / install / uninstall / update-config
        shell: pwsh
        run: ./packaging/intune/tests/test-scripts.ps1
